name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # 只要看到 /oc，且是你本人，就立刻干活
    if: |
      contains(github.event.comment.body, '/oc') &&
      (github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read        # 坚决只读，不给写代码的权限
      pull-requests: write  # 允许它在 PR 里回复评论
      issues: write         # 允许它在 Issue 里回复评论

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Create opencode.json
        env:
          MODEL_NAME: ${{ secrets.MY_PRIVATE_MODEL }}
          BASE_URL: ${{ secrets.MY_PRIVATE_URL }}
          API_KEY: ${{ secrets.MY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "myprovider": {
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "baseURL": "MY_BASE_URL",
                  "apiKey": "MY_API_KEY"
                },
                "models": {
                  "MY_MODEL_NAME": {
                    "name": "MY_MODEL_NAME",
                    "tools": true
                  }
                }
              }
            }
          }
          EOF
          sed -i "s|MY_BASE_URL|${BASE_URL}|g" ~/.config/opencode/opencode.json
          sed -i "s|MY_API_KEY|${API_KEY}|g" ~/.config/opencode/opencode.json
          sed -i "s|MY_MODEL_NAME|${MODEL_NAME}|g" ~/.config/opencode/opencode.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: myprovider/${{ secrets.MY_PRIVATE_MODEL }}
