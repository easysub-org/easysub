name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不加 v，留空仅构建）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 坑：必须 ≥22.18——单元测试 `node --test "tests/*.test.mjs"` 需要 21+ 的 glob 展开、
      # 直跑 .ts 需要 22.18+ 的类型剥离（20.x 两者都没有，npm test 必挂，第七轮审查实测）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # ⚠️ public/wasm/sherpa-onnx-asr.js 和 sherpa-onnx-punctuation.js
      # 使用 git 跟踪的补丁版（修复了 config 合并 + typeof process 守卫），
      # 不要用 release 的原始文件覆盖它们。
      - name: Download sherpa-onnx WASM
        run: |
          TMPDIR=$(mktemp -d)
          curl -sL \
            "https://github.com/easysub-org/easysub-wasm-builder/releases/download/build-20260723-1231/sherpa-onnx-wasm-simd-v1.13.4-zipformer-bilingual-zh-en-2023-02-20.tar.bz2" \
            | tar xj -C "$TMPDIR"
          mkdir -p public/wasm
          find "$TMPDIR" -type f -exec mv {} public/wasm/ \;
          rm -rf "$TMPDIR"
          git restore public/wasm/sherpa-onnx-asr.js public/wasm/sherpa-onnx-punctuation.js
          rm -f public/wasm/index.html public/wasm/app-asr.js
          ls -lh public/wasm/

      - name: 校验版本号合法
        run: node scripts/bump-version.mjs --check

      - name: Set release version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          V=${{ github.event.inputs.version }}
          # manifest.json 的 version 必须是"1~4 段整数"（浏览器硬约束）；脚本负责
          # 把发行写法翻译过去，并把原始写法写进 version_name：
          #   x.x.x        → manifest.version = x.x.x
          #   x.x.xbeta.x  → manifest.version = x.x.x.x、version_name = x.x.xbeta.x
          # 非法写法（1.8.0-beta.1 / 1.8beta / 1.8.0.1 …）在这里直接失败，不产出一个装不上的包。
          node scripts/bump-version.mjs "$V"
          # 面板/标题仍显示**原始写法**（用户要求：插件面板那个版本号保持原样）
          sed -i "s/开发版本/v$V/g" src/ui-body.html src/i18n.ts

      # 门卫等纯逻辑的回归测试（node --test 直跑 TS）。六轮审查里"能不能开始"这条规则
      # 翻转过一次，全靠人工回归——别再让它在没有测试兜底的情况下被改回去。
      - name: 单元测试（node --test）
        run: npm test

      - run: npm run build

      - name: 校验产物里的版本号（manifest=浏览器写法，面板=原始写法）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          V='${{ github.event.inputs.version }}'
          node -e '
            const m = require("./dist/manifest.json");
            if (!/^\d+(\.\d+){0,3}$/.test(m.version)) {
              console.error("::error::dist/manifest.json 的 version 非法：" + m.version); process.exit(1);
            }
            console.log("dist/manifest.json version =", m.version,
                        "version_name =", m.version_name || "(无)");
          '
          # 面板显示必须是原始写法（例如 v1.8.0beta.1），不能被换成 1.8.0.1
          grep -rq "v$V" dist/*.js || { echo "::error::面板里没有原始版本号 v$V（是不是被换成了浏览器写法？）"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: extension${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('-v{0}', github.event.inputs.version) || '' }}
          path: dist/

  # 纯 Web 版（可静态托管）：与扩展构建共用同一次 checkout，产物独立成 zip。
  # 平时（push/PR）只作为 artifact 上传；带版本号的 workflow_dispatch 运行时，
  # release job 会把 easysub-web-v*.zip 一并发布（见下方 release job 的资产列表）。
  #
  # 关键差异：
  #   - 不打包 412MB 的识别模型 .data（GitHub Pages 单文件上限 100MB），webpack 侧已排除，
  #     用户首次使用时在面板里一键下载或手动导入（存 IndexedDB，之后长期有效）；
  #   - 产物目录是 dist-web/，zip 内含 index.html 与 coi-serviceworker.js，
  #     解压即可托管（详见 README 的「纯 Web 版」一节）。
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 坑：必须 ≥22.18——单元测试 `node --test "tests/*.test.mjs"` 需要 21+ 的 glob 展开、
      # 直跑 .ts 需要 22.18+ 的类型剥离（20.x 两者都没有，npm test 必挂，第七轮审查实测）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Web 版同样需要 sherpa-onnx 的 wasm/loader 脚本；.data 会被 web 构建排除，
      # 这里下载整包只是为了拿到 sherpa-onnx-wasm-main-asr.wasm 与三个加载器脚本。
      - name: Download sherpa-onnx WASM
        run: |
          TMPDIR=$(mktemp -d)
          curl -sL \
            "https://github.com/easysub-org/easysub-wasm-builder/releases/download/build-20260723-1231/sherpa-onnx-wasm-simd-v1.13.4-zipformer-bilingual-zh-en-2023-02-20.tar.bz2" \
            | tar xj -C "$TMPDIR"
          mkdir -p public/wasm
          find "$TMPDIR" -type f -exec mv {} public/wasm/ \;
          rm -rf "$TMPDIR"
          git restore public/wasm/sherpa-onnx-asr.js public/wasm/sherpa-onnx-punctuation.js
          rm -f public/wasm/index.html public/wasm/app-asr.js

      - name: Set release version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          V=${{ github.event.inputs.version }}
          node scripts/bump-version.mjs "$V"          # 校验 + 写 package.json（manifest 由扩展那份负责）
          sed -i "s/开发版本/v$V/g" src/ui-body.html src/i18n.ts

      # 每个构建作业都跑一遍门卫测试：门卫规则曾在六轮审查里翻转，多一道兜底不嫌多
      - name: 单元测试（node --test）
        run: npm test

      - run: npm run build:web

      - name: Package web build
        run: |
          cd dist-web
          zip -r ../easysub-web${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('-v{0}', github.event.inputs.version) || '' }}.zip .
          cd ..
          ls -lh easysub-web*.zip
          # 产物守卫（两类）：
          #   ① web 包不该出现 412MB 的模型（出现即说明 webpack 排除规则失效）；
          #   ② 单个文件不得超过 100MB（GitHub Pages 的硬限制），顺带拦住将来误加的大文件。
          if unzip -l easysub-web*.zip | grep -q 'sherpa-onnx-wasm-main-asr.data'; then
            echo "::error::web 构建里混进了识别模型 .data，检查 webpack.config.js 的 ignore 规则"
            exit 1
          fi
          unzip -l easysub-web*.zip | awk 'NR>3 && $1 ~ /^[0-9]+$/ { if ($1 > 104857600) { print "::error file=" $4 "::超过 GitHub Pages 单文件 100MB 上限"; bad=1 } } END { exit bad }'

      - uses: actions/upload-artifact@v4
        with:
          name: web${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('-v{0}', github.event.inputs.version) || '' }}
          path: easysub-web*.zip

  build-lite:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 坑：必须 ≥22.18——单元测试 `node --test "tests/*.test.mjs"` 需要 21+ 的 glob 展开、
      # 直跑 .ts 需要 22.18+ 的类型剥离（20.x 两者都没有，npm test 必挂，第七轮审查实测）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Download sherpa-onnx WASM (lite)
        run: |
          TMPDIR=$(mktemp -d)
          curl -sL \
            "https://github.com/easysub-org/easysub-wasm-builder/releases/download/build-20260723-1231/sherpa-onnx-wasm-simd-v1.13.4-zipformer-bilingual-zh-en-2023-02-20-lite.tar.bz2" \
            | tar xj -C "$TMPDIR"
          mkdir -p public/wasm
          find "$TMPDIR" -type f -exec mv {} public/wasm/ \;
          rm -rf "$TMPDIR"
          git restore public/wasm/sherpa-onnx-asr.js public/wasm/sherpa-onnx-punctuation.js
          rm -f public/wasm/index.html public/wasm/app-asr.js
          ls -lh public/wasm/

      - name: Set release version
        run: |
          V=${{ github.event.inputs.version }}
          node scripts/bump-version.mjs "$V"
          sed -i "s/开发版本/v$V/g" src/ui-body.html src/i18n.ts

      # 每个构建作业都跑一遍门卫测试：门卫规则曾在六轮审查里翻转，多一道兜底不嫌多
      - name: 单元测试（node --test）
        run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension-lite-v${{ github.event.inputs.version }}
          path: dist/

  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    needs: [build, build-lite, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-v${{ github.event.inputs.version }}
          path: dist

      - name: Package extension (full + nomodel)
        run: |
          # nomodel 版：去掉 412MB 的 ASR 模型文件（Edge 商店对包体积有限制，装不下 full 版），
          # 模型以单文件作为独立资产发布，用户首次点「启动」时按引导导入一次即可
          cp dist/wasm/sherpa-onnx-wasm-main-asr.data ./sherpa-onnx-wasm-main-asr.data
          cd dist
          zip -r ../easysub-v${{ github.event.inputs.version }}-full.zip .
          zip -r ../easysub-v${{ github.event.inputs.version }}-nomodel.zip . -x "wasm/sherpa-onnx-wasm-main-asr.data"

      - uses: actions/download-artifact@v4
        with:
          name: web-v${{ github.event.inputs.version }}
          path: web-dist

      - uses: actions/download-artifact@v4
        with:
          name: extension-lite-v${{ github.event.inputs.version }}
          path: dist-lite

      - name: Package extension (lite)
        run: |
          cd dist-lite
          zip -r ../easysub-v${{ github.event.inputs.version }}-lite.zip .

      # Web 版 artifact 里就是打包好的 easysub-web-v*.zip，原样移到根目录作为 release 资产
      - name: Stage web build for release
        run: |
          mv web-dist/easysub-web*.zip .
          ls -lh easysub-web*.zip

      - name: Package translation models
        run: |
          python3 -m pip install -q --user huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          pairs = [
              ('Xenova/opus-mt-en-zh', 'opus-mt-en-zh'),
              ('Xenova/opus-mt-zh-en', 'opus-mt-zh-en'),
          ]
          files = [
              'config.json', 'generation_config.json', 'tokenizer.json',
              'tokenizer_config.json', 'special_tokens_map.json', 'quantize_config.json',
              'source.spm', 'target.spm', 'vocab.json',
              'onnx/encoder_model_quantized.onnx',
              'onnx/decoder_model_merged_quantized.onnx',
          ]
          for repo, local in pairs:
              for f in files:
                  hf_hub_download(repo, f, local_dir=local)
          PY
          rm -rf opus-mt-en-zh/.cache opus-mt-zh-en/.cache
          find opus-mt-en-zh opus-mt-zh-en -type f -printf '%p %s\n' | sort
          zip -r easysub-translation-models-v${{ github.event.inputs.version }}.zip opus-mt-en-zh opus-mt-zh-en
          ls -lh easysub-translation-models-v${{ github.event.inputs.version }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: |
            ## EasySub v${{ github.event.inputs.version }}

            ### full（默认）
            - 模型: Zipformer 中英双语, fp32 全精度
            - 大小: ~412MB
            - 精度更高，适合需要最佳识别质量的场景

            ### nomodel（不含识别模型，适合 Edge 商店 / 小体积安装）
            - 不包含语音识别模型，压缩包仅几十 MB
            - 需要额外下载模型文件 `sherpa-onnx-wasm-main-asr.data`（约 412MB，见下方资产列表）
            - 安装步骤：加载扩展后点击面板「启动」，会弹出模型引导窗，选择已下载的 `.data` 文件导入一次即可（之后不再询问）

            ### lite
            - 模型: Zipformer 中英双语, int8 量化
            - 大小: ~150MB
            - 体积更小、速度更快，适合资源受限的场景

            ### web（纯网页版，无需安装扩展）
            - 资产: `easysub-web-v${{ github.event.inputs.version }}.zip`（不含识别模型，仅几 MB）
            - 解压后托管到任意静态站点（GitHub Pages / 对象存储 / 自建服务器）即可使用
            - 需要跨源隔离（zip 内自带 coi-serviceworker.js 自动处理，首次访问会刷新一次）
            - 识别模型约 412MB，首次使用时在页面里一键下载或导入一次（存浏览器 IndexedDB）；
              也可直接访问在线部署：https://easysub-preview.hcz1017.dpdns.org/

            ### 实时翻译模型（可选，离线，约 216MB）
            启用面板"实时翻译"需要下载此模型包：
            `easysub-translation-models-v${{ github.event.inputs.version }}.zip`

            安装步骤：
            1. 下载并解压上方的 easysub-translation-models 压缩包
            2. 打开扩展面板 → 「实时翻译」→ 勾选「启用翻译」
            3. 点击「选择模型」，选中解压出的 `opus-mt-en-zh` / `opus-mt-zh-en` 所在的父文件夹
            4. 重新开始一次识别会话生效（翻译在本地离线进行，不上传任何内容）

            ### 语音识别模型单文件（nomodel 版与 web 版用户需要）
            `sherpa-onnx-wasm-main-asr.data`（约 412MB）

            **中国大陆用户访问 GitHub 不畅时，请从 ModelScope 或 Gitee 下载模型：**
            - ModelScope 直链（推荐，速度快）：https://modelscope.cn/models/hcz1017/easysub-model/resolve/master/sherpa-onnx-wasm-main-asr.data
            - Gitee（备用）：https://gitee.com/huchangzhi/easysub-model/releases

            扩展：Chrome → 扩展程序 → 加载已解压的扩展 → 选择解压后的目录
          files: |
            easysub-v${{ github.event.inputs.version }}-full.zip
            easysub-v${{ github.event.inputs.version }}-nomodel.zip
            easysub-v${{ github.event.inputs.version }}-lite.zip
            easysub-web-v${{ github.event.inputs.version }}.zip
            easysub-translation-models-v${{ github.event.inputs.version }}.zip
            sherpa-onnx-wasm-main-asr.data
          draft: false
          prerelease: false
